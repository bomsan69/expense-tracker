services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # Pinned to match the Dockerfile's `nextjs` user explicitly, rather than
    # relying on whatever `USER` the image happens to have — so the host's
    # bind-mounted ./logs directory has one fixed UID to be chowned to,
    # across rebuilds and redeploys (see README's Deployment section).
    user: "1001:1001"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/expense_tracker
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Optional: the `openai` SDK reads this itself if set, to point at an
      # OpenAI-compatible endpoint (e.g. OpenRouter) instead of OpenAI's own.
      # Unset or blank → the SDK's own default (api.openai.com). Still a
      # single OpenAI-shaped client either way — no provider abstraction
      # layer (SPEC.md §4 D5).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "3400:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: `docker compose run --rm migrate`. Under the `tools` profile so
  # it never starts with `up` — migrations are never run from the app's own
  # entrypoint, which would let two replicas race to mutate the schema.
  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/expense_tracker
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed"

volumes:
  mysql-data:
